name: Test runner egress restrictions

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  test-egress:
    runs-on: platform-arc-pilot
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check required tools
        run: |
          set -euo pipefail
          command -v curl
          curl --version

      - name: Test allowed and denied egress
        env:
          RANCHER_URL: https://rancher-test.world-direct.at/
        run: |
          set -euo pipefail

          failures=0

          {
            echo "## Runner egress tests"
            echo
            echo "| Test | Expected | Result | Details |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          record() {
            local name="$1" expected="$2" result="$3" details="$4"

            printf '| %s | %s | %s | %s |\n' \
              "$name" "$expected" "$result" "$details" \
              >> "$GITHUB_STEP_SUMMARY"

            if [[ "$result" == "FAIL" ]]; then
              echo "::error::$name: $details"
              failures=$((failures + 1))
            else
              echo "$name: $details"
            fi
          }

          # Disable proxies so tests exercise the pod's own egress policy.
          curl_options=(
            --noproxy '*'
            --silent
            --show-error
            --connect-timeout 5
            --max-time 15
            --output /dev/null
          )

          expect_allowed() {
            local name="$1" url="$2"
            local status rc=0

            status=$(curl "${curl_options[@]}" \
              --write-out '%{http_code}' "$url") || rc=$?

            if [[ "$rc" -eq 0 && "$status" =~ ^[1-5][0-9]{2}$ ]]; then
              record "$name" "Allowed" "PASS" "HTTP $status"
            else
              record "$name" "Allowed" "FAIL" \
                "curl exit $rc; HTTP ${status:-none}"
            fi
          }

          expect_blocked() {
            local name="$1" url="$2" allow_dns_failure="$3"
            local status rc=0

            # Ignore certificate errors only for negative tests. A reachable
            # destination must not look blocked merely because TLS is untrusted.
            status=$(curl "${curl_options[@]}" \
              --insecure --write-out '%{http_code}' "$url") || rc=$?

            if [[ "$status" != "000" && -n "$status" ]]; then
              record "$name" "Blocked" "FAIL" "Received HTTP $status"
            elif [[ "$rc" -eq 28 ]]; then
              record "$name" "Blocked" "PASS" "Connection/DNS timed out"
            elif [[ "$allow_dns_failure" == "yes" && "$rc" -eq 6 ]]; then
              record "$name" "Blocked" "PASS" "DNS resolution denied"
            else
              record "$name" "Blocked" "FAIL" \
                "Inconclusive curl exit $rc; expected timeout or permitted DNS denial"
            fi
          }

          expect_allowed "Rancher HTTPS" "$RANCHER_URL"
          expect_allowed "Rancher dev HTTPS" "https://rancher-dev.world-direct.at/"
          expect_allowed "Rancher production HTTPS" "https://rancher.world-direct.at/"
          expect_allowed "Rancher r HTTPS" "https://r.world-direct.at/"
          expect_allowed "GitHub" "https://github.com/"
          expect_allowed "GitHub API" "https://api.github.com/"
          expect_allowed "Action archive download" \
            "https://codeload.github.com/actions/checkout/tar.gz/refs/tags/v4"

          expect_blocked "Unapproved hostname" "https://example.com/" yes
          expect_blocked "Unapproved container registry" "https://ghcr.io/v2/" yes

          # These bypass DNS, testing actual outbound connection restrictions.
          expect_blocked "Direct IP: Cloudflare" "https://1.1.1.1/" no
          expect_blocked "Direct IP: Google" "https://8.8.8.8/" no

          # This hostname is allowed, but TCP port 80 is not.
          expect_blocked "Rancher HTTP / port 80" \
            "http://rancher-test.world-direct.at/" no

          echo
          if [[ "$failures" -gt 0 ]]; then
            echo "::error::$failures egress test(s) failed"
            exit 1
          fi

          echo "All egress tests passed."

      - name: Test privilege escalation restrictions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          failures=0

          {
            echo "## Runner privilege escalation tests"
            echo
            echo "| Test | Expected | Result | Details |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          record() {
            local name="$1" expected="$2" result="$3" details="$4"

            printf '| %s | %s | %s | %s |\n' \
              "$name" "$expected" "$result" "$details" \
              >> "$GITHUB_STEP_SUMMARY"

            if [[ "$result" == "FAIL" ]]; then
              echo "::error::$name: $details"
              failures=$((failures + 1))
            else
              echo "$name: $details"
            fi
          }

          runner_uid=$(id -u)
          if [[ "$runner_uid" -ne 0 ]]; then
            record "Runner user" "Non-root" "PASS" "UID $runner_uid"
          else
            record "Runner user" "Non-root" "FAIL" "Runner is already root"
          fi

          no_new_privs=$(awk '$1 == "NoNewPrivs:" { print $2 }' /proc/self/status)
          if [[ "$no_new_privs" == "1" ]]; then
            record "NoNewPrivs" "Enabled" "PASS" "Privilege gains through exec are disabled"
          else
            record "NoNewPrivs" "Enabled" "FAIL" \
              "NoNewPrivs is ${no_new_privs:-missing}; check allowPrivilegeEscalation: false"
          fi

          expect_sudo_denied() {
            local name="$1"
            shift
            local rc=0

            if ! command -v sudo >/dev/null 2>&1; then
              record "$name" "Denied" "PASS" "sudo is not installed"
              return
            fi

            timeout 5s sudo -n -k -- "$@" </dev/null >/dev/null 2>&1 || rc=$?

            if [[ "$rc" -eq 1 ]]; then
              record "$name" "Denied" "PASS" "Non-interactive sudo was denied"
            elif [[ "$rc" -eq 0 ]]; then
              record "$name" "Denied" "FAIL" "sudo executed a command as root"
            else
              record "$name" "Denied" "FAIL" "Inconclusive sudo probe exit $rc"
            fi
          }

          expect_sudo_denied "sudo root command" id -u
          expect_sudo_denied "sudo root shell" sh -c 'id -u'

          if [[ "$failures" -gt 0 ]]; then
            echo "::error::$failures privilege escalation test(s) failed"
            exit 1
          fi

          echo "All privilege escalation tests passed."

  test-kubectl:
    runs-on: platform-arc-pilot
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Check kubectl installation and client version
        run: |
          set -euo pipefail

          echo "## Runner kubectl check" >> "$GITHUB_STEP_SUMMARY"

          if ! command -v kubectl; then
            echo "::error::kubectl is not installed or is not on PATH"
            echo "FAIL: kubectl is not installed or is not on PATH" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          kubectl version --client | tee -a "$GITHUB_STEP_SUMMARY"