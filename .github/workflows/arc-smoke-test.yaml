name: ARC smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: arc-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Runner Details and Public IP
        run: |
          echo "Runner Public IP Address:"
          curl -s ifconfig.me
          echo "" # Adds a newline for cleaner log output
          
          echo "Running on an ARC-managed runner"
          uname -a